name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Ascend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-apk
          path: Ascend.apk

      # Every build of the default branch becomes a downloadable release you can open on your phone.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ascend build ${{ github.run_number }}
          body: "Open this page on your phone and tap **Ascend.apk** to install or update."
          files: Ascend.apk
          make_latest: true
